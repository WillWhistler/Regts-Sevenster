status:
  scope: >-
    The Main Theorem and sharp colour budget (Theorem 1.1 and
    Corollary 4.10), for natural rank bases including zero, over
    the flag model of multigraph fragments. The Section 7 results
    comprise even rank growth, minimum total dimension, minimal
    parity formulas, padding and prescribed dimensions. The appendix
    results comprise trace-zeta rationality under exponential growth
    (Corollary A.2) and rationality for arbitrary hook-confined
    sequences (Lemma A.9). The development also proves Deligne's
    fibre-functor theorem, the symmetric-group character theory,
    and the auxiliary separate colour bound k, 2ℓ ≤ ⌊2eR⌋.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "RS.regts_sevenster"
      file: "RS/Summit.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator-config.json"
      literature_dependencies: []
