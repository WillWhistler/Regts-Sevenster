version: "v0.4"

project:
  name: "A proof of the Regts–Sevenster conjecture, formalized"
  description: >-
    A Lean 4 formalization of the Regts–Sevenster conjecture, proved in
    both directions and resting on no assumption. A complex-valued graph
    parameter that is normalized at the empty graph and invariant under
    isomorphism has exponentially bounded edge-connection rank if and
    only if it is the partition function of a mixed edge-colouring
    model; and when the rank base is R the model may be taken with k
    even and ℓ odd colours satisfying k, 2ℓ ≤ ⌊2eR⌋. Nothing is assumed.
    Deligne's theorem on tensor categories, on which the forward
    direction rests, is itself proved in the development — in the
    fibre-functor form that is the substance of Deligne's own proof, and
    by a route through simple algebras in the ind-completion rather than
    his descent argument — and each of its hypotheses is discharged for
    a concretely constructed rigid symmetric monoidal envelope of the
    parameter's skein category. The symmetric-group character theory the
    argument needs is proved from Mathlib's linear algebra rather than
    cited, and the converse direction reproves Regts and Sevenster's own
    theorem. Every theorem of record depends only on propext,
    Classical.choice and Quot.sound, pinned in-tree so that a change to
    the axiom set is a build failure rather than a review task.
  authors: ["William Whistler"]
  license: "Apache-2.0"
  responsible_maintainers: ["William Whistler"]

classification:
  # The mathematics rather than the source document: graph parameters
  # and connection matrices, settled through symmetric tensor
  # categories over ℂ.
  arxiv: ["math.CO", "math.CT"]
  msc2020: ["05C31", "05C50", "18M05", "18M25", "20C30", "68V20"]

sources:
  - title: "Mixed partition functions are exactly the graph parameters
      of exponentially bounded edge-connection rank"
    authors: ["William Whistler"]
    id: "arXiv:2607.27198"
    type: "preprint"
    location: "Theorem 1.1; Corollary 4.10; Appendix A"
    relationship: "formalizes"
    license: "CC-BY-4.0"
    author_endorsement: "n/a"
    note: "The paper this development formalizes. Its author is this
      project's author, so there was no separate source author to
      contact."
  - title: "Mixed partition functions and exponentially bounded
      edge-connection rank"
    authors: ["Guus Regts", "Bart Sevenster"]
    id: "arXiv:1807.04494 (Ann. Inst. Henri Poincaré D 8 (2021),
      179-200; doi:10.4171/aihpd/100)"
    type: "journal article"
    location: "the conjecture; Definition 5; Proposition 3; Theorem 6"
    relationship: "independently-proves"
    author_endorsement: ""
    note: "The origin of the conjecture and of Definition 5. The
      development does not cite their Theorem 6 or their Proposition 3
      but proves both, the latter in a corrected form. Regts
      contacted."
  - title: "Catégories tensorielles"
    authors: ["Pierre Deligne"]
    id: "Mosc. Math. J. 2 (2002), 227-248"
    type: "journal article"
    location: "Théorème 0.6, with §0.1 for the definitions"
    relationship: "independently-proves"
    author_endorsement: "not-contacted"
    note: "Proved in the development rather than assumed, in the
      fibre-functor form that Deligne's own strategy establishes and by
      a different route; see fidelity and alignment below."
  - title: "Tannakian categories in positive characteristic"
    authors: ["Kevin Coulembier"]
    id: "arXiv:1812.02452 (Duke Math. J. 169 (2020), 3167-3219)"
    type: "journal article"
    location: "Lemma 3.3.2(ii), with Lemmas 1.2.10 and 1.5.2"
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: "The splitting-object pattern the development follows in place
      of Deligne's section 4 descent."
  - title: "Tensor categories (after P. Deligne)"
    authors: ["Victor Ostrik"]
    id: "arXiv:math/0401347"
    type: "preprint"
    location: "Theorem 2.3; section 2.4"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: "Consulted as an exposition of Deligne's theorem and of the
      strategy of its proof."

status:
  scope: >-
    Both directions of the Main Theorem, over the flag (half-edge)
    model of multigraph fragments: a graph parameter normalized at
    the empty graph has exponentially bounded edge-connection rank
    if and only if it is a mixed partition function, together with
    the dimension bound k, 2ℓ ≤ ⌊2eR⌋ and the appendix's
    quantitative trace-zeta theorem. Nothing is assumed: Deligne's
    theorem on tensor categories, on which the forward direction
    rests, is itself proved here as `RS.deligne_theorem`, in the
    fibre-functor form that is the substance of his own proof, and every
    hypothesis of it is discharged for the concretely constructed
    envelope. The converse rests on nothing. The classical
    symmetric-group input is a theorem of the development, not an
    assumption. The conditional forms of the summit theorems are
    retained alongside the unconditional ones, to exhibit the
    dependency structure.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "RS.regts_sevenster"
      file: "RS/Summit.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
      # Deligne's theorem, in fibre-functor form, is
      # `RS.deligne_theorem`, proved here.
    - declaration: "RS.regts_sevenster_characterisation"
      file: "RS/Summit.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
    - declaration: "RS.deligne_theorem"
      file: "RS/Classical/Deligne/DeligneAssembly.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
      # Deligne, Catégories tensorielles, Mosc. Math. J. 2 (2002),
      # 227-248, Théorème 0.6, proved rather than cited. The route is
      # not Deligne's own: his section 4 descent is replaced by
      # splitting the tensor generator alone and passing to a simple
      # quotient, after Coulembier, Tannakian categories in positive
      # characteristic, Duke Math. J. 169 (2020), Lemma 3.3.2(ii).
    - declaration: "RS.regts_sevenster_quant"
      file: "RS/Summit.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
    - declaration: "RS.regts_sevenster_converse"
      file: "RS/TheoremConverse.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      literature_dependencies: []
      # No hypothesis of its own: Regts–Sevenster's Theorem 6 is
      # reproved here rather than cited.

automation:
  methods:
    - method: "agent"
      models: ["claude-fable-5", "claude-opus-5"]
      framework: "Claude Code"
      tool_setup: "A single interactive main line driving fleets of
        subagents. The main line kept the hard mathematics and the
        statements; subagents were given narrowly scoped, individually
        committable proof obligations against statements already fixed
        upstream, with one owner per file and no git access.
        Verification was the Lean kernel throughout: every change had to
        leave `lake build` green with zero warnings, and
        `#guard_msgs`-pinned `#print axioms`, `#check` and `#print`
        audits are part of the default build target, so a change to the
        axiom set, to the type of any definition a summit is phrased in
        or of any theorem of record, or to the content of
        `DeligneTheoremStatement` and of every predicate its hypothesis
        list is phrased in, is a compile error rather than a review
        task."
      cost:
        wall_time: "~15 days"
        spend_usd: "Max 20x subscriptions"
        hardware: "one workstation"
      prompting_notes: "Subagent tasks were written as Lean statements
        to be proved, not as prose goals, so that success was
        machine-checkable. Tasks that resisted decomposition were pulled
        back to the main line rather than retried. Search tools were
        allowed to find certificates, but certificates were frozen as
        data and re-proved in Lean; nothing found by search was
        trusted."
  spend_usd: "subscription-based usage; no metered API spend"
  notes: "Beyond the in-tree audits, the theorems of record are
    certified in CI with leanprover/comparator: Challenge.lean is
    self-contained, importing Mathlib alone and carrying the statement
    surface itself, and states them with sorry; Solution.lean proves
    each by the theorem of record of the same name against the
    identical definitions of RS/Definitions.lean, and comparator checks at the
    kernel-export level that the statements and their definitions
    agree, that the proofs use no axiom outside the whitelist, and
    that the kernel replays them."

fidelity:
  divergences: >-
    Seven deliberate divergences from the paper's presentation, each
    recorded in the repository.

    (1) Connection rank. The paper defines the rank of the infinite
    connection matrix as the supremum of the ranks of its finite
    submatrices; the formalization bounds the dimension of the row
    span instead, avoiding infinite-matrix rank. The two conditions
    are proved equivalent (`RS.edgeRankBounded_iff_submatrixRank`,
    RS/Novel/Skein/ConnectionRank.lean).

    (2) The rank base. The paper's hypothesis (H2) requires an
    integer R ≥ 1; `EdgeRankBounded` admits any natural number. The
    bound is monotone in the base (`RS.EdgeRankBounded.mono`), so
    nothing is gained or lost.

    (3) The vertex functional. `MixedFunctional` assigns values to
    multisets of even colours and sets of odd colours, with
    antisymmetry supplied by a sorting-sign evaluator, rather than
    to the paper's κ-paired wedge presentation. The dictionary
    between the two, including the parity twist that must not be
    carried across it, is the paper's §5.4.

    (4) Composition is applicative. `Fragment.compose F G` glues the
    last t labels of F to the first t of G; it is the paper's G ∘ F
    and Mathlib's diagrammatic F ≫ G.

    (5) The appendix's growth constant. Appendix A fixes a real
    A ≥ 1; `RS.objectFrobeniusTower` and
    `RS.traceZeta_rational_of_object` take any real A with
    dim End(Z^⊗n) ≤ A^n. Weakening a hypothesis strengthens the
    statement, and the extra range is degenerate: below 1 the bound
    forces End(Z^⊗n) = 0 for all large n.

    (6) The envelope is completed in two stages. The paper's Cauchy
    completion is 𝒟_f = Kar(Add(𝒞_f)) (§3.4); the tree builds
    Env f = Karoubi (Mat_ (Karoubi (SkeinObj f))), which is
    Kar(Add(Kar(𝒞_f))). The inner Karoubi is where the atoms live —
    an atom is the image of an atomic idempotent of a skein
    endomorphism algebra — and the nilpotent-trace argument for the
    matrix envelope reads the atomic decomposition of each entry.
    Both are Cauchy completions of 𝒞_f, hence equivalent; the
    hypotheses are discharged for the one the tree builds.

    (7) The route to the super symmetric power. The paper factors the
    functional β_d(T_d, −) through Sym_s^d V by combining the
    S_d-invariance of the pairing (Lemma 5.1(b)) with the invariance
    of the star tensor. The tree works on coordinates instead: the
    star class absorbs any relabelling of its legs
    (RS.vertexStarClass_perm, RS/Novel/Coordinates/StarSymm.lean),
    the model permutation acts on coordinates by the odd-inversion
    sign (RS.coordOf_modelPermMap',
    RS/Novel/Coordinates/ModelPermCoord.lean), and the two combine
    into the sign rule RS.starCoord_perm
    (RS/Novel/Coordinates/StarPerm.lean), which over ℂ is already the
    statement that the coordinate functional lives on Sym_s^d V.
    Lemma 5.1(b) is proved (RS.betaColour_perm',
    RS/Classical/Super/ColourPairingSymm.lean) but is not consumed.

    Two machine-checked findings sharpened the paper rather than
    diverging from it: the odd-sector parity of the square
    specialization forces the supertrace argument to run at side
    s + 1 for odd s (the displayed bound survives because 2ℓ is
    even), and the degenerate side s = 0 at R = 0 needs an explicit
    guard. Both are recorded in ClassicalOverview.md §4.

review:
  status: "self-assessed"
  reviewers: []
  notes: ""

alignment:
  namespace: "RS"
  statements:
    - source: "Theorem 1.1 (Main Theorem), both directions"
      lean: "RS.regts_sevenster_characterisation"
      module: "RS/Summit.lean"
      status: "proved"
      note: "No hypothesis. The form taking RS.DeligneTheoremStatement
        as an argument, RS.regts_sevenster_iff
        (RS/TheoremConverse.lean), is retained to exhibit the
        dependency structure."
    - source: "Theorem 1.1, forward direction"
      lean: "RS.regts_sevenster"
      module: "RS/Summit.lean"
      status: "proved"
      note: "No hypothesis; likewise RS.regts_sevenster_deligne_only
        (RS/TheoremForward.lean) for the dependency structure."
    - source: "Corollary 4.10 (the dimension bound k, 2ℓ ≤ ⌊2eR⌋)"
      lean: "RS.regts_sevenster_quant"
      module: "RS/Summit.lean"
      status: "proved"
    - source: "Regts–Sevenster Theorem 6 (the converse)"
      lean: "RS.regts_sevenster_converse"
      module: "RS/TheoremConverse.lean"
      status: "proved"
      note: "The paper cites this direction; the development proves it,
        with base max 1 (k + 2ℓ) and no hypothesis."
    - source: "Theorem A.1 (rational trace zeta functions)"
      lean: "RS.traceZeta_rational_of_object,
        RS.traceZeta_superSpectrum_of_object"
      module: "RS/Novel/Envelope/ObjectTower.lean"
      status: "proved"
      note: "In the appendix's own generality and with its own
        hypothesis and threshold: for an object X of a rigid symmetric
        C-linear category with End 1 = C whose tensor powers have
        finite-dimensional endomorphism algebras of dimension at most
        A^n, and every integer side s > 2e√A, degrees at most s − 1. The
        appendix derives the symmetric-group action, the propagation of
        vanishing, the traces and the Frobenius identity from the
        category and the object; that derivation is
        RS.objectFrobeniusTower. The same conclusions over the derived
        interface alone are RS.FrobeniusTower.traceZeta_rational_sharp
        and RS.FrobeniusTower.traceZeta_superSpectrum_sharp
        (RS/Novel/Envelope/TraceZetaSharp.lean), which the skein
        endomorphism algebras instantiate directly. The forward proof
        itself consumes only the existentially-quantified side
        (RS.FrobeniusTower.traceZeta_rational,
        RS/Novel/Envelope/TraceZeta.lean), which holds over an arbitrary
        Schur package."
    - source: "Theorem 4.8 (Deligne's theorem), hypotheses for the envelope"
      lean: "RS.env_delignePackage, RS.skein_delignePackage"
      module: "RS/Novel/Envelope/EnvDelignePackage.lean"
      status: "proved"
      note: "Deligne's hypotheses discharged for Env f = Karoubi (Mat_
        (Karoubi (SkeinObj f))); the fibre functor is then restricted
        back to the skein category."
    - source: "Theorem 4.8 (Deligne's theorem) itself"
      lean: "RS.deligne_theorem"
      module: "RS/Classical/Deligne/DeligneAssembly.lean"
      status: "proved"
      note: "RS.DeligneTheoremStatement (RS/Definitions.lean) carries
        Deligne's own hypotheses; it is weaker than what Deligne proves
        in two ways, being one direction of his equivalence and taking
        the conclusion in fibre-functor form (RS.DeligneFibreFunctor).
        The route is not Deligne's: his section 4 descent along a
        faithfully flat Isom-tensor torsor is replaced by splitting the
        tensor generator alone and passing to a quotient by a maximal
        ideal, after Coulembier. See ClassicalOverview.md section 6."
    - source: "Regts–Sevenster Proposition 3, closed sector"
      lean: "RS.eulerianIndependence"
      module: "RS/Novel/Skein/AllInternalAgreement.lean"
      status: "proved"
      note: "Cited in the literature; proved here, in full interface
        strength over arbitrary ambient fragments."
    - source: "Regts–Sevenster Proposition 3, open sector"
      lean: "RS.pairedLedger"
      module: "RS/Novel/Skein/PairedAssembly.lean"
      status: "proved"
      note: "In its corrected form: the chord-signed canonical value is
        a function of the boundary pairing alone. Independence across
        pairings is false, and the refutation
        (RS.not_throughIndependenceC) is itself a theorem of the tree."
    - source: "The classical symmetric-group character theory"
      lean: "RS.schurPackage"
      module: "RS/Classical/SchurTheory/Package.lean"
      status: "proved"
      note: "Frobenius formula, orthonormality, irreducible realization
        with sign, block theory, branching and square-dimension growth,
        built from Mathlib's linear algebra with no combinatorial
        citations. See ClassicalOverview.md §2."
    - source: "Definition 5 of Regts–Sevenster"
      lean: "RS.mixedPartition, RS.IsMixedPartitionFunction"
      module: "RS/Definitions.lean"
      status: "proved"
      note: "A definition, on the flag model; see fidelity above."
    - source: "Lemma 5.1, the Koszul sign of a rearrangement"
      lean: "RS.betaDiag_eq_betaColour, RS.betaColour_perm'"
      module: "RS/Novel/Coordinates/BetaDiagForm.lean,
        RS/Classical/Super/ColourPairingSymm.lean"
      status: "proved"
      note: "Part (a), the interleaved evaluation, is what the tree
        consumes. Part (b), the S_d-invariance of the pairing, is
        proved but unused; see divergence (7) above."
    - source: "§2.3, the edge-connection rank hypothesis (H2)"
      lean: "RS.EdgeRankBounded, RS.edgeRankBounded_iff_submatrixRank"
      module: "RS/Novel/Skein/ConnectionRank.lean"
      status: "proved"
      note: "The row-span reading, proved equivalent to the paper's
        finite-submatrix reading; the hypothesis itself is defined in
        RS/Definitions.lean."

acknowledgements: >-
  Built on Mathlib. The mathematics formalized rests on Regts and
  Sevenster's conjecture and their §4 argument, on Deligne's theorem
  on tensor categories and Ostrik's exposition of it, on Coulembier's
  route to it through simple algebras in the ind-completion (Tannakian
  categories in positive characteristic, Duke Math. J. 169 (2020)),
  and on the connection-matrix framework of Freedman, Lovász and
  Schrijver.
