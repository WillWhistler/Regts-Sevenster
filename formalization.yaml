automation:
  methods:
    - method: "agent"
      models: ["claude-fable-5", "claude-opus-5"]
      framework: "Claude Code"
      tool_setup: "An interactive lead agent assigned subagents
        narrowly scoped Lean proof obligations against fixed
        statements, with one owner per file and no subagent git access.
        The lead agent handled the statements and proof assembly.
        Verification used Lean builds with zero warnings and pinned
        statement and axiom audits."
      cost:
        wall_time: "~15 days"
        spend_usd: "Max 20x subscriptions"
        hardware: "one workstation"
      prompting_notes: "Tasks specified Lean statements to prove.
        The lead agent took over tasks that resisted decomposition.
        Certificates found by search were stored as data and verified
        in Lean."
    - method: "agent"
      models: ["gpt-6-astra"]
      framework: "OpenAI Codex"
      tool_setup: "An interactive agent formalized the total-dimension
        bound through block faithfulness, a polynomial commutant
        estimate and transport of the skein action; the rank-growth,
        minimum-dimension and colour-padding results; and Schrijver's
        factorial trace argument with categorical and strand instances
        and semisimplicity corollaries. The hook rationality proof was
        generalized to arbitrary rectangular dimensions. Verification
        used Lean builds, environment linters, pinned audits and
        comparator certification."
  spend_usd: "subscription-based usage; no metered API spend"
  notes: "CI runs source style checks, the full Lean build, environment
    linters and leanprover/comparator. The default build includes
    pinned statement and axiom audits for the theorems of record,
    including growth, minimality and padding. BlueprintFactorial
    checks that the envelope's semisimplicity and abelianness are
    independent of Schur theory, trace zeta and Deligne, and that the
    forward summits use the factorial trace theorem.
    Challenge.lean imports Mathlib alone, copies the certified
    statement definitions and declares seven goals with sorry;
    Solution.lean proves them from the theorems of record. Comparator
    checks agreement of the statements and definitions, the axiom
    whitelist and Lean kernel replay, using comparator-config.json."

fidelity:
  divergences: >-
    (1) Connection rank. Lean uses Module.rank of the connection
    pairing's row span. RS.edgeRankBounded_iff_submatrixRank proves
    equivalence with the paper's supremum of finite-submatrix ranks
    (RS/Novel/Skein/ConnectionRank.lean).

    (2) Rank base. The paper allows real R ≥ 1; EdgeRankBounded and
    RS.regts_sevenster_total use natural R, including zero.
    Section 7.6 derives the sharp real budget from the formal
    results: construct a model at B = ⌈R⌉, then identify its
    dimension with its even rank-growth limit, bounded by R.

    (3) Dimension estimate. For d = k + 2ℓ and d,n ≥ 1, Lemma 4.9
    gives d^(2n) ≤ rk M_{f,2n} binom(n + d² − 1, d² − 1).
    It uses the sum of surviving block dimensions (Lemma 4.8) and
    Cauchy–Schwarz. Lean uses individual block faithfulness
    (Lemma A.4) to prove d^(2n) ≤ rk M_{f,2n} (n + 1)^(2d²).
    Both estimates count simultaneous word-pair orbits to bound the
    commutant in the ordinary endomorphism algebra of the total
    vector space, including parity-reversing maps. Both give d ≤ R
    and the same rank-growth limit.

    (4) Intrinsic dimension. Lean defines minimumColourDimension as
    the least total colour bound and proves that the even rank roots
    tend to it. The paper defines the growth base as the supremum
    of rank roots over all positive arities and identifies it with
    the same minimum (Lemma 7.1 and Theorem 7.3).

    (5) Vertex functional. MixedFunctional assigns values to multisets
    of even colours and sets of odd colours; evalOdd supplies the
    sorting sign. Lean's hRS is the paper's h^ξ, the raw star
    coefficient in the e_i, ξ_i basis. Lemmas 5.6 and 5.7 give
    h^RS = h^ξ ∘ Sym_s(Ψ), where Ψ fixes the even basis and sends
    ξ_i to η_i. This isometry preserves the twisted edge tensor and
    the partition function. Lean proves the evaluation equality
    directly from star coordinates, partner signs and sorting signs.
    The descent to symmetric and exterior monomials is expressed by
    RS.starCoord_perm, combining star invariance with the Koszul
    action on coordinates (RS/Novel/Coordinates/StarPerm.lean).

    (6) Composition. Fragment.compose F G glues F's last t labels to
    G's first t labels: the paper's G ∘ F and Mathlib's F ≫ G.

    (7) Envelope and fibre functor. Lean builds
    Env f = Karoubi (Mat_ (Karoubi (SkeinObj f))), equivalent to the
    paper's Cauchy completion 𝒟_f = Kar(Add(𝒞_f)) (§3.4).
    DeligneFibreFunctor records exactness and faithfulness;
    DeligneFibreFunctor.toPackage supplies the symmetric monoidal
    ℂ-linear interface used in reconstruction and the colour bounds.

    (8) Appendix growth constant. Corollary A.2 assumes A ≥ 1;
    RS.objectFrobeniusTower and RS.traceZeta_rational_of_object
    accept any real A satisfying dim End(Z^⊗n) ≤ A^n. The sequence
    results for Lemma A.9 allow arbitrary natural a,b and retain
    numerator degree at most b and denominator degree at most a.

review:
  status: "self-assessed"
  reviewers: []

alignment:
  namespace: "RS"
  statements:
    - source: "Theorem 1.1, the existential characterization"
      lean: "RS.regts_sevenster_characterisation"
      module: "RS/Summit.lean"
      status: "proved"
      note: "For normalized isomorphism-invariant parameters, existence
        of a natural rank base is equivalent to existence of a mixed
        model."
    - source: "Theorem 1.1, existence from bounded connection rank"
      lean: "RS.regts_sevenster"
      module: "RS/Summit.lean"
      status: "proved"
      note: "For every R : ℕ and f : EdgeRankParameter R, supplies a
        mixed model representing f."
    - source: "Theorem 1.1 and Corollary 4.10, k + 2ℓ ≤ R"
      lean: "RS.regts_sevenster_total"
      module: "RS/Summit.lean"
      status: "proved"
      note: "A representing model with k + 2ℓ ≤ R, for natural R
        including zero."
    - source: "Polynomial consequence of Lemma 4.9"
      lean: "RS.stdModel_pow_le_connectionRank"
      module: "RS/Classical/Interfaces/TotalDimension.lean"
      status: "proved"
      note: "d^(2n) ≤ rk M_{f,2n} (n + 1)^(2d²), with the
        polynomial factor sufficient for the sharp colour budget
        and even rank-growth limit."
    - source: "Auxiliary separate-sector colour bound"
      lean: "RS.regts_sevenster_quant"
      module: "RS/Summit.lean"
      status: "proved"
      note: "k, 2ℓ ≤ ⌊2eR⌋, obtained from square principal
        specializations."
    - source: "Lemma 7.1 and Theorem 7.3(a), even rank-growth limit"
      lean: "RS.regts_sevenster_rank_growth"
      module: "RS/Summit.lean"
      status: "proved"
      note: "The even connection-rank roots converge to
        minimumColourDimension, including zero."
    - source: "Theorem 7.3(c), minimum total model dimension"
      lean: "RS.regts_sevenster_minimum"
      module: "RS/Summit.lean"
      status: "proved"
      note: "Supplies a model attaining the least total colour bound."
    - source: "Theorem 7.3(b), minimal parity formulas"
      lean: "RS.TotalBoundedMixedModel.even_dimension_eq,
        RS.TotalBoundedMixedModel.half_odd_dimension_eq"
      module: "RS/TheoremPadding.lean"
      status: "proved"
      note: "k = (d + f(○))/2 and ℓ = (d − f(○))/4 for a
        model attaining minimum total dimension d."
    - source: "Lemma 7.2, padding"
      lean: "RS.MixedFunctional.padColours_represents"
      module: "RS/Novel/Skein/ColourPadding.lean"
      status: "proved"
      note: "For k₂ ≥ k₁ and ℓ₂ ≥ ℓ₁ with k₂ − 2ℓ₂ = k₁ − 2ℓ₁,
        extension by zero along partner-preserving colour embeddings
        preserves the partition function."
    - source: "Theorem 7.5, prescribed dimensions"
      lean: "RS.regts_sevenster_prescribed"
      module: "RS/Summit.lean"
      status: "proved"
      note: "Exact dimensions k,2ℓ are characterized by rank base
        k + 2ℓ and free-circle value k − 2ℓ, including k = ℓ = 0,
        for normalized isomorphism-invariant parameters."
    - source: "Regts–Sevenster Theorem 6 (the converse)"
      lean: "RS.regts_sevenster_converse"
      module: "RS/TheoremConverse.lean"
      status: "proved"
      note: "The exact rank bound with base k + 2ℓ is
        RS.mixedPartition_edgeRankBounded in the same module.
        The existential statement chooses max 1 (k + 2ℓ)."
    - source: "Corollary A.2, trace zeta under exponential growth"
      lean: "RS.traceZeta_rational_of_object,
        RS.traceZeta_superSpectrum_of_object"
      module: "RS/Novel/Envelope/ObjectTower.lean"
      status: "proved"
      note: "For an object X of a rigid symmetric ℂ-linear monoidal
        category with End 𝟙 = ℂ and finite-dimensional End(X^⊗n)
        of dimension at most A^n, every natural side s > 2e√A gives
        coprime numerator and denominator of constant term 1 and
        degrees at most s − 1, and reduced super-spectrum multisets
        of sizes at most s − 1. RS.objectFrobeniusTower derives the
        required action and trace identities from the category and
        object."
    - source: "Lemma A.9, hook-confined sequences"
      lean: "RS.newtonH_series_rational_of_hook_vanishing,
        RS.superPowerSums_of_hook_vanishing"
      module: "RS/Classical/SymFun/ZetaRational.lean,
        RS/Classical/SymFun/HookVanishing.lean"
      status: "proved"
      note: "Coprime rational form and reduced super-spectrum
        with numerator degree at most b and denominator degree
        at most a, for arbitrary natural a,b. The positive and
        negative power-sum multisets have sizes at most a and b."
    - source: "Theorem 4.3, nilpotent traces by the factorial argument"
      lean: "RS.scalarTrace_eq_zero_of_isNilpotent_factorial"
      module: "RS/Novel/Envelope/FactorialTrace.lean"
      status: "proved"
      note: "The cycle-trace formula makes a nonzero nilpotent trace
        force factorial endomorphism growth. The strand instance
        supplies the summits' semisimplicity proof."
    - source: "Theorem 4.7, application to the envelope"
      lean: "RS.env_delignePackage, RS.skein_delignePackage"
      module: "RS/Novel/Envelope/EnvDelignePackage.lean"
      status: "proved"
      note: "Verifies Deligne's hypotheses for Env f and restricts
        the resulting symmetric monoidal ℂ-linear functor to the
        skein category. The hD argument is supplied by
        RS.deligne_theorem."
    - source: "Deligne Théorème 0.6, fibre-functor form used in
        Theorem 4.7"
      lean: "RS.deligne_theorem"
      module: "RS/Classical/Deligne/DeligneAssembly.lean"
      status: "proved"
      note: "An essentially small abelian rigid symmetric ℂ-linear
        monoidal category with scalar unit endomorphisms, a finite
        tensor generator and moderate length growth admits an exact
        faithful ℂ-linear symmetric monoidal functor to finite-dimensional
        super vector spaces. The proof splits the generator over a simple
        algebra in the ind-completion, following Coulembier's pattern."
    - source: "Regts–Sevenster Proposition 3, mixed Eulerian-subset form"
      lean: "RS.eulerianIndependence"
      module: "RS/Novel/Skein/AllInternalAgreement.lean"
      status: "proved"
      note: "For a fixed mixed functional, the contribution of an
        Eulerian edge subset is independent of its transition system
        and compatible orientation."
    - source: "Open-fragment extension of Regts–Sevenster Proposition 3"
      lean: "RS.EdgeSubset.signedValueAt_of_labelChords_eq_pairing"
      module: "RS/Novel/Skein/PropThreeOpen.lean"
      status: "proved"
      note: "For a fixed compatible boundary state, transition systems
        with the same boundary pairing have the same chord-signed canonical
        value. RS.pairedLedger supplies invariance under paired moves."
    - source: "The classical symmetric-group character theory"
      lean: "RS.schurPackage"
      module: "RS/Classical/SchurTheory/Package.lean"
      status: "proved"
      note: "Frobenius formula, orthonormality, irreducible realization
        with sign, block theory, branching and square-dimension growth,
        constructed from Jacobi–Trudi characters and Mathlib's linear
        algebra."
    - source: "Definition 2.1 (Regts–Sevenster's Definition 5)"
      lean: "RS.mixedPartition, RS.IsMixedPartitionFunction"
      module: "RS/Definitions.lean"
      status: "defined"
      note: "The sum over Eulerian edge subsets and colourings, with
        circuit signs and the free-circle factor (k − 2ℓ)^circles."
    - source: "Lemma 5.1, the Koszul sign of a rearrangement"
      lean: "RS.betaDiag_eq_betaColour, RS.betaColour_perm'"
      module: "RS/Novel/Coordinates/BetaDiagForm.lean,
        RS/Classical/Super/ColourPairingSymm.lean"
      status: "proved"
      note: "Part (a) identifies the interleaved evaluation with the
        colour pairing; part (b) proves its invariance under simultaneous
        super permutations."
    - source: "§2.3, the edge-connection rank hypothesis (H2)"
      lean: "RS.EdgeRankBounded, RS.edgeRankBounded_iff_submatrixRank"
      module: "RS/Novel/Skein/ConnectionRank.lean"
      status: "proved"
      note: "The row-span reading, proved equivalent to the paper's
        finite-submatrix reading; the hypothesis itself is defined in
        RS/Definitions.lean."

acknowledgements: >-
  Built on Mathlib. The mathematics formalized rests on Regts and
  Sevenster's conjecture and their §4 argument, on Deligne's theorem
  on tensor categories and Ostrik's exposition of it, on Coulembier's
  route to it through simple algebras in the ind-completion (Tannakian
  categories in positive characteristic, Duke Math. J. 169 (2020)),
  on Schrijver's factorial-rank proof of nilpotent-trace vanishing
  (2015, Proposition 4), and on the connection-matrix framework of
  Freedman, Lovász and Schrijver.
