version: "v0.4"

project:
  name: "A proof of the Regts–Sevenster conjecture, formalized"
  description: >-
    A Lean 4 proof of the Regts–Sevenster conjecture. A complex-valued
    graph parameter, normalized at the empty graph and invariant under
    isomorphism, has exponentially bounded edge-connection rank if and
    only if it is a mixed partition function. For a natural rank base R,
    a representing model can be chosen with k even and 2ℓ odd colours
    satisfying k + 2ℓ ≤ R. The development also proves the even connection-rank
    growth limit, minimum total colour dimension, minimal parity
    formulas and prescribed-dimension criterion.
    Schrijver's factorial argument supplies nilpotent-trace vanishing;
    semisimplicity and Deligne's fibre-functor theorem give the model;
    a polynomial commutant estimate gives the sharp colour budget.
    Deligne's theorem and the required symmetric-group character
    theory are proved within the development. The appendix's trace-zeta
    results give rationality and degree bounds, with an independent
    proof of nilpotent-trace vanishing. The theorems of record use only
    propext, Classical.choice and Quot.sound, checked by pinned audits.
  authors: ["William Whistler"]
  license: "Apache-2.0"
  responsible_maintainers: ["William Whistler"]

classification:
  arxiv: ["math.CO", "math.CT"]
  msc2020: ["05C31", "05C50", "18M05", "18M25", "20C30", "68V20"]

